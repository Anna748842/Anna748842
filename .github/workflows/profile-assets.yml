name: Update Profile Assets

on:
  schedule:
    - cron: "15 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  profile-assets:

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # Generate GitHub Stats locally
      # -------------------------------------------------------

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=79C0FF&text_color=C9D1D9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Generate Languages locally
      # -------------------------------------------------------

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # Generate GitHub Trophies LOCALLY
      # -------------------------------------------------------

      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: Anna748842
          output_path: profile/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: darkhub

      # -------------------------------------------------------
      # Python setup
      # -------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # -------------------------------------------------------
      # Generate contribution activity + streak
      # -------------------------------------------------------

      - name: Generate activity and streak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_activity.py

      # -------------------------------------------------------
      # Commit generated assets
      # -------------------------------------------------------

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "chore: update profile assets"

          git push